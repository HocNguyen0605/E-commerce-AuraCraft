<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng – AuraCraft</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/header-footer.css">
    <link rel="stylesheet" href="../assets/css/pages/styleCart.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="cart-page">
        <div class="container">
            <h1 class="section-title">Giỏ hàng của bạn</h1>

            <div class="cart-items">
                <div class="cart-item">
                    <div class="cart-shop-header">
                        <input type="checkbox" class="shop-checkbox" checked>
                        <i class="fa-solid fa-store"></i> <span>AuraCraft Official</span>
                    </div>
                    <div class="cart-item-content">
                        <div class="cart-item-left">
                            <input type="checkbox" class="item-checkbox" checked>
                            <img src="../assets/img/products/bracelet_01.jpg" alt="Vòng tay thạch anh hồng">
                            <div class="item-info">
                                <h3>Vòng tay thạch anh hồng</h3>
                                <p class="item-category">Phân loại: Hạt thạch anh 8mm</p>
                                <p class="item-price">150.000đ</p>
                            </div>
                        </div>
                        <div class="cart-item-right">
                            <div class="item-quantity">
                                <button class="qty-btn" data-action="decrease">‑</button>
                                <span class="qty-value">1</span>
                                <button class="qty-btn" data-action="increase">+</button>
                            </div>
                            <div class="item-actions">
                                <button class="action-btn find-similar">Tìm kiếm tương tự</button>
                                <button class="action-btn remove-btn">Xóa</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="cart-item">
                    <div class="cart-shop-header">
                        <input type="checkbox" class="shop-checkbox" checked>
                        <i class="fa-solid fa-store"></i> <span>Handmade By My</span>
                    </div>
                    <div class="cart-item-content">
                        <div class="cart-item-left">
                            <input type="checkbox" class="item-checkbox" checked>
                            <img src="../assets/img/products/necklace_02.jpg" alt="Dây chuyền Custom">
                            <div class="item-info">
                                <h3>Dây chuyền mặt trăng (Custom mẫu có sẵn)</h3>
                                <div class="item-category custom-details">
                                    <p>- Giá cơ sở: 120.000đ</p>
                                    <p>- Dây da thay thế: 30.000đ</p>
                                    <p>- 5 hạt chữ: 50.000đ</p>
                                    <p>- Charm hoa (x1): 40.000đ</p>
                                </div>
                                <p class="item-price">240.000đ</p>
                            </div>
                        </div>
                        <div class="cart-item-right">
                            <div class="item-quantity">
                                <button class="qty-btn" data-action="decrease">‑</button>
                                <span class="qty-value">1</span>
                                <button class="qty-btn" data-action="increase">+</button>
                            </div>
                            <div class="item-actions">
                                <button class="action-btn find-similar">Tìm kiếm tương tự</button>
                                <button class="action-btn remove-btn">Xóa</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="cart-summary">
                <p>Tổng cộng: <strong class="total-price">390.000đ</strong></p>
                <button class="btn btn-primary checkout-btn">Tiến hành thanh toán</button>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        fetch('../components/header.html')
            .then(response => response.text())
            .then(data => {
                let html = data.replace(/href="index\.html"/g, 'href="../index.html"');
                document.getElementById('header-placeholder').innerHTML = html;
            })
            .catch(error => console.error('Error loading header:', error));

        fetch('../components/footer.html')
            .then(response => response.text())
            .then(data => {
                let html = data.replace(/href="index\.html"/g, 'href="../index.html"');
                document.getElementById('footer-placeholder').innerHTML = html;
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>
</body>
</html>
