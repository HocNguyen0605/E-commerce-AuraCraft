<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kênh Thợ - Cập nhật Sản phẩm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/header-footer.css">
    <link rel="stylesheet" href="../assets/css/pages/styleSeller.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="seller-layout container">
        <!-- Sidebar -->
        <aside class="seller-sidebar">
            <div class="seller-profile">
                <img src="https://i.pravatar.cc/150?img=32" alt="Tiệm Vòng Mộc Lan" class="profile-img">
                <h3>Tiệm Vòng Mộc Lan</h3>
                <p class="seller-role">Thợ thủ công Trang sức</p>
            </div>
            <nav class="seller-nav">
                <a href="seller-dashboard.html"><i class="bi bi-pie-chart-fill"></i> Tổng quan Doanh thu</a>
                <a href="seller-products.html" class="active"><i class="bi bi-box-seam-fill"></i> Quản lý Sản phẩm</a>
                <a href="chat-seller.html"><i class="bi bi-chat-dots-fill"></i> Tin nhắn <span class="noti-count">2</span></a>
                <a href="order-management.html"><i class="bi bi-card-list"></i> Quản lý Đơn hàng</a>
                <a href="buyer-requests.html"><i class="bi bi-shop"></i> Chợ Custom & Báo giá</a>
                <a href="#"><i class="bi bi-gear-fill"></i> Cài đặt</a>
            </nav>
        </aside>

        <!-- Content -->
        <section class="seller-content">
            <div class="content-header">
                <h1 class="page-title">Thêm/Sửa Sản phẩm</h1>
                <div>
                    <a href="seller-products.html" class="btn btn-outline" style="margin-right: 10px;">Hủy bỏ</a>
                    <button class="btn btn-primary" onclick="alert('Đã lưu sản phẩm thành công!')"><i class="bi bi-check-lg"></i> Lưu Sản phẩm</button>
                </div>
            </div>

            <!-- Form -->
            <div class="dashboard-section form-section">
                <form action="#" method="POST">
                    
                    <div class="form-row">
                        <!-- Cột trái: Thông tin cơ bản -->
                        <div class="form-col col-main">
                            <div class="form-group">
                                <label>Tên sản phẩm *</label>
                                <input type="text" class="form-control" placeholder="Nhập tên sản phẩm (Ví dụ: Vòng tay đan dây macrame...)" value="Vòng tay Macrame đính đá thạch anh">
                            </div>

                            <div class="form-group">
                                <label>Mô tả chi tiết</label>
                                <textarea class="form-control" placeholder="Mô tả về chất liệu, nguồn gốc đá, ý nghĩa phong thủy, hướng dẫn bảo quản...">Vòng tay được làm thủ công bằng dây macrame cao cấp, kết hợp với đá thạch anh tự nhiên. Phù hợp cho những ai yêu thích sự mộc mạc và phong cách Boho.</textarea>
                            </div>

                            <div class="form-row">
                                <div class="form-col">
                                    <div class="form-group">
                                        <label>Giá bán (VND) *</label>
                                        <input type="number" class="form-control" placeholder="0" value="150000">
                                    </div>
                                </div>
                                <div class="form-col">
                                    <div class="form-group">
                                        <label>Kho hàng *</label>
                                        <input type="number" class="form-control" placeholder="Số lượng" value="12">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Cột phải: Hình ảnh & Phân loại -->
                        <div class="form-col col-side">
                            <div class="form-group">
                                <label>Hình ảnh sản phẩm</label>
                                <div class="image-upload-area" onclick="document.getElementById('file-upload').click()">
                                    <i class="bi bi-cloud-arrow-up"></i>
                                    <p>Tải ảnh lên hoặc kéo thả</p>
                                    <span style="font-size: 0.8rem; color: #999;">PNG, JPG, tối đa 5MB</span>
                                </div>
                                <input type="file" id="file-upload" style="display: none;" multiple>
                                
                                <div class="image-preview-list">
                                    <img src="https://images.unsplash.com/photo-1611591437281-460bfbe1220a?q=80&w=200&auto=format&fit=crop" class="image-preview" alt="Preview 1">
                                    <div class="image-preview" style="display: flex; align-items: center; justify-content: center; background: #eee; cursor: pointer;">
                                        <i class="bi bi-plus" style="font-size: 2rem; color: #999;"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Danh mục</label>
                                <select class="form-control">
                                    <option>Vòng tay</option>
                                    <option>Dây chuyền</option>
                                    <option>Vòng chân</option>
                                    <option>Khác</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Trạng thái</label>
                                <select class="form-control">
                                    <option>Đang bán</option>
                                    <option>Nháp (Ẩn khỏi cửa hàng)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                </form>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        fetch('../components/header.html').then(response => response.text()).then(data => { let html = data.replace(/href="index\.html"/g, 'href="../index.html"'); document.getElementById('header-placeholder').innerHTML = html; }).catch(error => console.error('Error loading header:', error));

        fetch('../components/footer.html').then(response => response.text()).then(data => { let html = data.replace(/href="index\.html"/g, 'href="../index.html"'); document.getElementById('footer-placeholder').innerHTML = html; }).catch(error => console.error('Error loading footer:', error));
    </script>
<script src="../assets/js/popup.js"></script>
</body>
</html>
