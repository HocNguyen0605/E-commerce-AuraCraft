<header class="site-header">
    <div class="container header-inner">
        <a href="/pages/home" class="logo" data-shell-route="home" aria-label="AuraCraft - Trang chủ">
            <span class="logo-icon">A</span>uraCraft
        </a>

        <form class="search-box" action="products" method="get" role="search">
            <label class="sr-only" for="site-search">Tìm kiếm sản phẩm</label>
            <input id="site-search" type="search" name="q" placeholder="Tìm sản phẩm, gian hàng..." autocomplete="off">
            <button type="submit" class="btn-search" aria-label="Tìm kiếm">Tìm</button>
        </form>

        <button class="menu-toggle" type="button" aria-label="Mở menu" aria-controls="nav-menu-mobile" aria-expanded="false">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-menu" id="nav-menu-mobile" aria-label="Điều hướng chính" aria-hidden="true">
            <button class="close-menu" type="button" aria-label="Đóng menu"><i class="fa-solid fa-xmark"></i></button>
            <a href="products" data-shell-route="products">Sản phẩm</a>
            <a href="custom" data-shell-route="custom">Thiết kế</a>

            <!-- Mặc định nút đăng nhập -->
            <a href="login" id="nav-login" class="nav-text-btn" data-shell-route="login">Đăng nhập</a>

            <!-- Phần hiển thị sau khi đăng nhập (Sẽ ẩn/hiện bằng JS) -->
            <div id="user-logged-in" class="user-logged-in" hidden>
                <a href="profile" id="user-greeting" class="user-greeting" data-shell-route="profile" aria-label="Mở trang cá nhân"></a>
            </div>

            <a href="cart" class="icon-btn cart-icon-btn" data-shell-route="cart" aria-label="Giỏ hàng" title="Giỏ hàng">
                <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
                <span class="cart-count-badge" id="header-cart-count" aria-live="polite" hidden>0</span>
            </a>
        </nav>
    </div>
    <div class="menu-overlay" id="menu-overlay" aria-hidden="true"></div>
</header>
