<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="logo">
            <span class="logo-icon">A</span>uraCraft
        </a>

        <form class="search-box" action="products" method="get" onsubmit="event.preventDefault(); var q = this.querySelector('input').value.trim(); if(q){ var ctx = window.CTX || (location.pathname.split('/')[1] ? '/' + location.pathname.split('/')[1] : ''); location.href = ctx + '/pages/products?q=' + encodeURIComponent(q); }">
            <input type="text" name="q" placeholder="Tìm sản phẩm, gian hàng...">
            <button type="submit" class="btn-search">Tìm</button>
        </form>

        <button class="menu-toggle" onclick="document.getElementById('nav-menu-mobile').classList.add('active'); document.getElementById('menu-overlay').classList.add('active')">
            <i class="fa-solid fa-bars"></i>
        </button>

        <nav class="nav-menu" id="nav-menu-mobile">
            <button class="close-menu" onclick="document.getElementById('nav-menu-mobile').classList.remove('active'); document.getElementById('menu-overlay').classList.remove('active')"><i class="fa-solid fa-xmark"></i></button>
            <a href="products">Sản phẩm</a>
            <a href="customizer">Thiết kế</a>

            <!-- Mặc định nút đăng nhập -->
            <a href="login.html" id="nav-login" class="nav-text-btn">Đăng nhập</a>

            <!-- Phần hiển thị sau khi đăng nhập (Sẽ ẩn/hiện bằng JS) -->
            <div id="user-logged-in" style="display: none; align-items: center; gap: 8px;">
                <span id="user-greeting" style="font-weight: 500; color: #333;"></span>
                <a href="profile.html" class="icon-btn" title="Trang cá nhân"><i class="fa-regular fa-user"></i></a>
            </div>

            <a href="cart.jsp" class="icon-btn" title="Giỏ hàng"><i class="fa-solid fa-cart-shopping"></i></a>
        </nav>
    </div>
    <div class="menu-overlay" id="menu-overlay" onclick="document.getElementById('nav-menu-mobile').classList.remove('active'); document.getElementById('menu-overlay').classList.remove('active')"></div>
</header>
